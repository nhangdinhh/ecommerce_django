{% extends 'base.html' %}
{% load static %}
{% block content %}

<!-- Title Page -->
<section class="bg-title-page p-t-100 p-b-100 flex-col-c-m" 
         style="background: linear-gradient(135deg, rgba(17, 24, 39, 0.9), rgba(75, 85, 99, 0.9)), url('{% static 'images/heading-pages-02.jpg' %}') no-repeat center center; background-size: cover; position: relative;">
	<h2 class="l-text2 t-center text-white" style="font-weight: 800; font-size: 3.5rem; letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
		CHECKOUT
	</h2>
	<p class="m-text13 t-center text-white mt-2" style="font-size: 1.2rem; font-weight: 500;">
		Secure Your Purchase
	</p>
</section>

<style>
  .form-control {
    display: block;
    width: 100%;
    padding: .8rem 1rem;
    font-size: 1rem;
    color: #495057;
    background-color: #fff;
    background-clip: padding-box;
    border: 1px solid #e6e6e6 !important;
    border-radius: 4px;
    box-shadow: none;
    transition: all 0.2s ease;
  }
  .form-control:focus {
    border-color: #e65540 !important;
    outline: none;
    box-shadow: none;
  }
  .form-label {
    font-weight: 500;
    margin-bottom: .5rem;
    color: #333;
    font-size: 0.95rem;
  }
  .form-section {
    background: #ffffff;
    padding: 3rem;
    border-radius: 8px;
    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.05);
    margin-bottom: 30px;
  }
  .checkout-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: #333;
    padding-bottom: 1rem;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid #f2f2f2;
  }
  .form-check-label {
    color: #555;
    padding-left: 0 !important;
  }
  .form-check-input {
    position: relative !important;
    margin-top: 0 !important;
    margin-left: 0 !important;
  }
</style>

<div class="container p-t-65 p-b-50">
  <div class="row">
    <div class="col-md-7 col-lg-8 form-section">
      <h4 class="checkout-title">Billing Information</h4>
      <form method="POST" class="needs-validation" novalidate>
        {% csrf_token %}

        <div class="mb-4">
          <label class="form-label" for="username">Username</label>
          {{ form.username }}
        </div>

        <div class="mb-4">
          <label class="form-label" for="phone">Phone Number</label>
          {{ form.phone_number }}
        </div>

        <div class="mb-4">
          <label class="form-label" for="address">Street Address</label>
          {{ form.street_address }}
        </div>

        <hr class="my-4" style="border-color: #f2f2f2;">

        <div class="form-check mb-4" style="display: flex; align-items: center; gap: 10px;">
          <input {% if form.save_info.value %}checked{% endif %} class="form-check-input" type="checkbox" id="save-info" style="width: 18px; height: 18px; margin: 0;">
          <label class="form-check-label m-b-0" for="save-info" style="cursor: pointer; padding-top: 2px;">
            Save this information for future purchases
          </label>
        </div>

        <h4 class="checkout-title m-t-40">Payment Method</h4>
        <div class="my-3">
          <div class="form-check mb-3" style="display: flex; align-items: center; gap: 10px;">
            <input id="Online" name="payment_option" value="Online" type="radio" class="form-check-input" disabled style="margin: 0; width: 18px; height: 18px;">
            <label class="form-check-label text-muted m-b-0" for="Online" style="padding-top: 2px;">
              Online Payment (Coming Soon)
            </label>
          </div>

          <div class="form-check" style="display: flex; align-items: center; gap: 10px;">
            <input id="COD" name="payment_option" value="Cash on Delivery" type="radio" class="form-check-input" required checked style="margin: 0; width: 18px; height: 18px;">
            <label class="form-check-label m-b-0" for="COD" style="cursor: pointer; padding-top: 2px; font-weight: 500; color: #333;">Cash on Delivery</label>
          </div>
        </div>

        <hr class="my-4" style="border-color: #f2f2f2;">

        <div class="mb-4">
          <label class="form-label" for="note">Order Note <span class="text-muted" style="font-weight: normal; font-size: 0.85rem;">(Optional)</span></label>
          <textarea name="note" id="note" class="form-control" rows="4" placeholder="Write any specific request for delivery..."></textarea>
        </div>

        <button class="flex-c-m bg4 bo-rad-23 hov1 s-text1 trans-0-4 w-full" style="color: white; height: 50px; font-weight: bold; border: none; font-size: 1.1rem; margin-top: 2rem;" type="submit">
          Place Order
        </button>
      </form>
    </div>

    {% include "order_snippet.html" %}
  </div>
</div>

{% endblock content %}
