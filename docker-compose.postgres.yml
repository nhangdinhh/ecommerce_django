services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nhang_shop}
      POSTGRES_USER: ${POSTGRES_USER:-nhang_shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nhang_shop} -d ${POSTGRES_DB:-nhang_shop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    environment:
      DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:-nhang_shop}
      POSTGRES_USER: ${POSTGRES_USER:-nhang_shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
